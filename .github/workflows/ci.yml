# 역할: self-hosted runner에서 pytest 실행 후 Allure 리포트를 GitHub Pages에 배포
# self-hosted runner: 내 PC에서 직접 실행 (게임 GUI 환경 필요)

name: Flappy Bird QA Automation CI

on:
  push:
    branches: [ main ]
    paths:
      # Flappy Bird 폴더 내 코드 변경 시에만 실행
      - '01.game-automation/01.flappy-bird/**'
      # 단, 문서/템플릿 변경은 제외
      - '!01.game-automation/01.flappy-bird/**.md'
      - '!01.game-automation/01.flappy-bird/assets/templates/**'

jobs:
  test:
    runs-on: self-hosted

    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: 1

    steps:
      - name: 작업 폴더 사전 정리
        run: |
          Remove-Item -Path "01.game-automation/01.flappy-bird/.pytest_cache" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "01.game-automation/01.flappy-bird/__pycache__" -Recurse -Force -ErrorAction SilentlyContinue
        shell: powershell

      - name: 코드 체크아웃
        uses: actions/checkout@v3
        with:
          submodules: true

      - name: Python 버전 확인
        run: python --version
        shell: powershell

      - name: 의존성 설치
        run: |
          cd 01.game-automation/01.flappy-bird
          python -m pip install -r requirements.txt --no-cache-dir
        shell: powershell

      - name: FlapPyBird 실행
        run: |
          $gamePath = "${{ github.workspace }}\FlapPyBird"
          Start-Process python -ArgumentList "main.py" -WorkingDirectory $gamePath
          Start-Sleep -Seconds 5
        shell: powershell

      - name: 게임 창 확인
        run: |
          python -c "import win32gui; hwnd = win32gui.FindWindow(None, 'Flappy Bird'); print('OK: Flappy Bird 창 발견 (hwnd={})'.format(hwnd)) if hwnd != 0 else (print('ERROR: Flappy Bird 창을 찾을 수 없음'), exit(1))"
        shell: powershell

      - name: pytest 실행
        run: |
          cd 01.game-automation/01.flappy-bird
          python -m pytest tests/ -v --alluredir=allure-results
        shell: powershell

      - name: Allure 리포트 생성
        run: |
          cd 01.game-automation/01.flappy-bird
          allure generate allure-results -o allure-report --clean
        shell: powershell

      - name: GitHub Pages 배포
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: 01.game-automation/01.flappy-bird/allure-report

      - name: 작업 폴더 정리
        if: always()
        run: |
          Remove-Item -Path "01.game-automation/01.flappy-bird/allure-results" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "01.game-automation/01.flappy-bird/allure-report" -Recurse -Force -ErrorAction SilentlyContinue
        shell: powershell