# .github/workflows/ci.yml
# 역할: self-hosted runner에서 pytest 실행 후 Allure 리포트를 GitHub Pages에 배포
# self-hosted runner: 내 PC에서 직접 실행 (게임 GUI 환경 필요)

name: Game QA Automation CI

on:
  push:
    branches: [ main ]  # main 브랜치에 push 할 때마다 실행

jobs:
  test:
    runs-on: self-hosted

    env:
      # GitHub Secrets 에서 Python 경로 읽어옴
      # PC 바뀌면 Secrets 값만 수정하면 됨 (ci.yml 수정 불필요)
      PYTHON: ${{ secrets.PYTHON_PATH }}

    steps:
      # submodules: true → FlapPyBird submodule 도 같이 체크아웃
      - name: 코드 체크아웃
        uses: actions/checkout@v3
        with:
          submodules: true

      - name: Python 버전 확인
        env:
          PYTHON_EXE: ${{ secrets.PYTHON_PATH }}
        run: |
          Invoke-Expression "$env:PYTHON_EXE --version"
        shell: powershell

      # --no-cache-dir: pip 캐시를 C드라이브에 저장하지 않음
      # 매번 push 할 때마다 C드라이브 용량 부족 방지
      - name: 의존성 설치
        run: |
          cd 01.game-automation/01.flappy-bird
          & "$env:PYTHON" -m pip install -r requirements.txt --no-cache-dir
        shell: powershell

      # github.workspace = 레포 루트 경로 (하드코딩 대신 사용)
      # Start-Sleep: 게임이 완전히 실행될 때까지 3초 대기
      - name: FlapPyBird 실행
        run: |
          Start-Process "$env:PYTHON" -ArgumentList "${{ github.workspace }}\FlapPyBird\main.py"
          Start-Sleep -Seconds 3
        shell: powershell

      - name: pytest 실행
        run: |
          cd 01.game-automation/01.flappy-bird
          & "$env:PYTHON" -m pytest tests/ -v --alluredir=allure-results
        shell: powershell

      # --clean: 이전 리포트 삭제 후 새로 생성
      - name: Allure 리포트 생성
        run: |
          cd 01.game-automation/01.flappy-bird
          allure generate allure-results -o allure-report --clean
        shell: powershell

      - name: GitHub Pages 배포
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: 01.game-automation/01.flappy-bird/allure-report

      # if: always() → 테스트 실패해도 항상 실행
      # 용량 큰 allure 결과물 삭제
      - name: 작업 폴더 정리
        if: always()
        run: |
          Remove-Item -Path "01.game-automation/01.flappy-bird/allure-results" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "01.game-automation/01.flappy-bird/allure-report" -Recurse -Force -ErrorAction SilentlyContinue
        shell: powershell