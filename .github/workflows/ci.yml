# .github/workflows/ci.yml
# 역할: self-hosted runner에서 pytest 실행 후 Allure 리포트를 GitHub Pages에 배포
# self-hosted runner: 내 PC에서 직접 실행 (게임 GUI 환경 필요)

name: Game QA Automation CI

on:
  push:
    branches: [ main ]  # main 브랜치에 push 할 때마다 실행

jobs:
  test:
    runs-on: self-hosted  # 내 PC(self-hosted runner)에서 실행

    env:
      # CI 환경 한글 깨짐 방지
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: 1

    steps:
      # submodules: true → FlapPyBird submodule 도 같이 체크아웃
      - name: 코드 체크아웃
        uses: actions/checkout@v3
        with:
          submodules: true

      # 시스템 PATH 에 등록된 Python 사용
      # Install for all users 로 설치해서 runner 서비스도 접근 가능
      - name: Python 버전 확인
        run: python --version
        shell: powershell

      # --no-cache-dir: pip 캐시를 C드라이브에 저장하지 않음
      # 매번 push 할 때마다 C드라이브 용량 부족 방지
      - name: 의존성 설치
        run: |
          cd 01.game-automation/01.flappy-bird
          python -m pip install -r requirements.txt --no-cache-dir
        shell: powershell

      # github.workspace: 레포 루트 경로 (하드코딩 대신 사용)
      # Start-Sleep 5초: 게임이 완전히 실행될 때까지 충분히 대기
      - name: FlapPyBird 실행
        run: |
          # 게임 실행 후 로그 파일에 출력 저장
          Start-Process python -ArgumentList "${{ github.workspace }}\FlapPyBird\main.py" -RedirectStandardOutput "game_log.txt" -RedirectStandardError "game_error.txt" -NoNewWindow
          Start-Sleep -Seconds 5
          # 로그 출력
          if (Test-Path "game_log.txt") { Get-Content "game_log.txt" }
          if (Test-Path "game_error.txt") { Get-Content "game_error.txt" }
        shell: powershell
        
      # 게임 창이 실제로 떴는지 확인
      # 창을 못 찾으면 에러 메시지 출력 후 종료
      - name: 게임 창 확인
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          $hwnd = [System.IntPtr]::Zero
          $hwnd = [System.Windows.Forms.NativeWindow]::new()
          python -c "
          import win32gui
          hwnd = win32gui.FindWindow(None, 'Flappy Bird')
          if hwnd == 0:
              print('ERROR: Flappy Bird 창을 찾을 수 없음')
              exit(1)
          else:
              print(f'OK: Flappy Bird 창 발견 (hwnd={hwnd})')
          "
        shell: powershell

      # --alluredir: Allure 결과물 저장 경로 지정
      - name: pytest 실행
        run: |
          cd 01.game-automation/01.flappy-bird
          python -m pytest tests/ -v --alluredir=allure-results
        shell: powershell

      # --clean: 이전 리포트 삭제 후 새로 생성
      - name: Allure 리포트 생성
        run: |
          cd 01.game-automation/01.flappy-bird
          allure generate allure-results -o allure-report --clean
        shell: powershell

      # peaceiris/actions-gh-pages: GitHub Pages 배포 액션
      # github_token: GitHub 이 자동으로 제공하는 인증 토큰
      - name: GitHub Pages 배포
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: 01.game-automation/01.flappy-bird/allure-report

      # if: always() → 테스트 실패해도 항상 실행
      # 용량 큰 allure 결과물 삭제해서 디스크 용량 확보
      - name: 작업 폴더 정리
        if: always()
        run: |
          Remove-Item -Path "01.game-automation/01.flappy-bird/allure-results" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "01.game-automation/01.flappy-bird/allure-report" -Recurse -Force -ErrorAction SilentlyContinue
        shell: powershell