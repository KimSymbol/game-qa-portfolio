# .github/workflows/ci.yml
name: Game QA Automation CI

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: self-hosted

    steps:
      # submodules: true → FlapPyBird submodule 도 같이 체크아웃
      - name: 코드 체크아웃
        uses: actions/checkout@v3
        with:
          submodules: true

      - name: Python 버전 확인
        run: python --version
        shell: powershell

      - name: 의존성 설치
        run: |
          cd 01.game-automation/01.flappy-bird
          python -m pip install -r requirements.txt
        shell: powershell

      # github.workspace = 레포 루트 경로 (하드코딩 대신 사용)
      - name: FlapPyBird 실행
        run: |
          Start-Process python -ArgumentList "${{ github.workspace }}\FlapPyBird\main.py"
          Start-Sleep -Seconds 3
        shell: powershell

      - name: pytest 실행
        run: |
          cd 01.game-automation/01.flappy-bird
          python -m pytest tests/ -v --alluredir=allure-results
        shell: powershell

      - name: Allure 리포트 생성
        run: |
          cd 01.game-automation/01.flappy-bird
          allure generate allure-results -o allure-report --clean
        shell: powershell

      - name: GitHub Pages 배포
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: 01.game-automation/01.flappy-bird/allure-report